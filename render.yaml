services:
  - type: web
    name: production-research-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROMPT_INJECTION_PROTECTION
        value: "True"
      - key: CACHE_TOOL_CALLS
        value: "True"
      - key: ENABLE_JUDGE_STEP
        value: "True"
